<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Tag agar web berfungsi seperti aplikasi asli saat ditambahkan ke layar utama -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a237e">
    <title>AI Modul Ajar</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1a237e; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #5c6bc0; margin-top: 0; margin-bottom: 25px; font-size: 13px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { background-color: #2e7d32; color: #fff; border: none; padding: 14px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #1b5e20; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        .loader { display: none; border: 3px solid #f3f3f3; border-top: 3px solid #3f51b5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-box { width: 100%; height: 400px; padding: 15px; border: 1px solid #c5cae9; border-radius: 8px; overflow-y: auto; background-color: #fafafa; font-family: 'Times New Roman', serif; white-space: pre-wrap; margin-top: 20px; display: none; line-height: 1.5; box-sizing: border-box; }
        .btn-copy { background-color: #3f51b5; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mesin AI Pembuat Modul</h1>
    <p class="subtitle">Aplikasi Lintas Perangkat (HP & Laptop)</p>

    <div class="form-group">
        <label>Google Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Mulai dengan AIzaSy...">
    </div>
    
    <div class="form-group">
        <label>Pilih Model AI (Ganti jika terjadi galat)</label>
        <select id="aiModel">
            <option value="gemini-flash-latest">Gemini Flash (Versi Terbaru - Tercepat)</option>
            <option value="gemini-pro-latest">Gemini Pro (Versi Terbaru - Cerdas)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Mata Pelajaran</label>
        <input type="text" id="mapel" placeholder="Contoh: Matematika">
    </div>
    <div class="form-group">
        <label>Fase, Kelas / Semester</label>
        <input type="text" id="kelas" placeholder="Contoh: Fase D, Kelas VII / Ganjil">
    </div>
    <div class="form-group">
        <label>Topik Pembelajaran</label>
        <input type="text" id="bab" placeholder="Contoh: Aljabar">
    </div>
    <div class="form-group">
        <label>Alokasi Waktu</label>
        <input type="text" id="waktu" placeholder="Contoh: 2 JP">
    </div>

    <button id="btnGenerate" onclick="generateModul()">Buat Modul Ajar</button>
    <div class="loader" id="loader"></div>
    
    <div id="resultBox" class="result-box"></div>
    <button id="btnCopy" class="btn-copy" onclick="copyResult()">Salin Teks Modul</button>
</div>

<script>
    async function generateModul() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const aiModel = document.getElementById('aiModel').value;
        const mapel = document.getElementById('mapel').value || "[Mapel]";
        const kelas = document.getElementById('kelas').value || "[Kelas]";
        const bab = document.getElementById('bab').value || "[Topik]";
        const waktu = document.getElementById('waktu').value || "[Waktu]";

        if (!apiKey) {
            alert("API Key wajib diisi!");
            return;
        }

        const btn = document.getElementById('btnGenerate');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const btnCopy = document.getElementById('btnCopy');

        btn.disabled = true;
        btn.innerText = "Memproses (Harap Tunggu)...";
        loader.style.display = "block";
        resultBox.style.display = "none";
        btnCopy.style.display = "none";

        const promptText = `Bertindaklah sebagai Ahli Kurikulum Merdeka. Buat Modul Ajar untuk pelajaran ${mapel}, ${kelas}, materi: ${bab}, waktu ${waktu}.
        Gunakan struktur ini:
        A. IDENTITAS 
        B. KESIAPAN PESERTA DIDIK 
        C. KARAKTERISTIK MATERI 
        D. PROFIL PELAJAR PANCASILA
        DESAIN PEMBELAJARAN: 
        A. CP 
        B. TUJUAN 
        C. LANGKAH BERDIFERENSIASI 
        D. ASESMEN 
        E. LAMPIRAN.`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const data = await response.json();

            if (!response.ok) {
                const errDetail = data.error ? data.error.message : response.statusText;
                throw new Error(`Galat API (${response.status}): ${errDetail}`);
            }
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const textResult = data.candidates[0].content.parts[0].text;
                resultBox.innerHTML = textResult.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                resultBox.style.display = "block";
                btnCopy.style.display = "block";
            } else {
                throw new Error("Respon tidak sesuai format yang diharapkan.");
            }

        } catch (error) {
            alert("Terjadi Masalah: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Buat Modul Ajar";
            loader.style.display = "none";
        }
    }

    function copyResult() {
        const resultBox = document.getElementById("resultBox");
        navigator.clipboard.writeText(resultBox.innerText)
            .then(() => alert("Modul berhasil disalin ke clipboard!"))
            .catch(() => alert("Gagal menyalin. Silakan blok teks secara manual lalu salin."));
    }
</script>
</body>
</html>
